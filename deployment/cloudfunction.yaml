# Cloud Functions gen2 設定ファイル
# デプロイコマンド:
# gcloud functions deploy pollJmaFeed --gen2 \
#   --runtime nodejs22 \
#   --trigger-http \
#   --entry-point pollJmaFeed \
#   --source src/poller \
#   --memory 512MB \
#   --timeout 55s \
#   --max-instances 3 \
#   --set-env-vars USER_AGENT="jma-alert-bot/1.0 (+https://example.com/contact)" \
#   --set-env-vars PUSH_TO_GITHUB=true \
#   --set-env-vars GITHUB_OWNER=your-username \
#   --set-env-vars GITHUB_REPO=jma-alert-api

name: pollJmaFeed
runtime: nodejs22
entryPoint: pollJmaFeed
trigger:
  type: http
  allowPublic: false
resources:
  memory: 512MB
  timeout: 55s
  maxInstances: 3
serviceConfig:
  ingress: internal-and-cloud-load-balancing
environment:
  USER_AGENT: "jma-alert-bot/1.0 (+https://example.com/contact)"
  PUSH_TO_GITHUB: "false"
  # GITHUB_OWNER: your-username
  # GITHUB_REPO: jma-alert-api
  # GITHUB_TOKEN: 環境変数から取得 (Secret Manager推奨)
