# Cloud Scheduler ジョブ設定
# 毎分実行: pollJmaFeed

# デプロイコマンド:
# gcloud scheduler jobs create http poll-jma-feed \
#   --schedule="*/1 * * * *" \
#   --time-zone="Asia/Tokyo" \
#   --http-method=GET \
#   --uri=https://REGION-PROJECT_ID.cloudfunctions.net/pollJmaFeed \
#   --oidc-service-account-email=SERVICE_ACCOUNT@PROJECT_ID.iam.gserviceaccount.com \
#   --oidc-token-audience=https://REGION-PROJECT_ID.cloudfunctions.net/pollJmaFeed

jobs:
  - name: poll-jma-feed
    description: "毎分、気象庁防災情報フィードをポーリング"
    schedule: "*/1 * * * *"  # UTC 毎分
    timeZone: "Asia/Tokyo"
    attemptDeadline: "60s"
    retryConfig:
      retryCount: 1
    httpTarget:
      method: GET
      # uri は下記を置き換え:
      # uri: https://asia-northeast1-PROJECT_ID.cloudfunctions.net/pollJmaFeed
      oidcToken:
        serviceAccountEmail: "jma-alert@PROJECT_ID.iam.gserviceaccount.com"
        # audience: CloudFunction の URL
